{% extends "base.html" %}

{% block title %}Send Feedback - Stride{% endblock %}

{% block content %}
<div class="form-page">
    <header class="page-header">
        <h1>Send Feedback</h1>
        <p class="subtitle">Help us improve Stride</p>
    </header>

    <form method="post" class="form card">
        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category">
                <option value="general">General</option>
                <option value="bug">Bug Report</option>
                <option value="feature">Feature Request</option>
                <option value="praise">Something I Love</option>
            </select>
        </div>

        <div class="form-group">
            <label for="subject">Subject *</label>
            <input type="text" id="subject" name="subject" required placeholder="Brief summary of your feedback">
        </div>

        <div class="form-group">
            <label for="message">Message *</label>
            <textarea id="message" name="message" required rows="6" placeholder="Tell us more..."></textarea>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Send Feedback</button>
        </div>
    </form>
</div>
{% endblock %}
