<!DOCTYPE html>
<html>
<head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 1280px;
            height: 720px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .logo-container {
            opacity: 0;
            transform: scale(0.98);
            animation: logoReveal 5s cubic-bezier(0.16, 1, 0.3, 1) 2s forwards;
        }
        
        @keyframes logoReveal {
            0% { 
                opacity: 0; 
                transform: scale(0.98);
            }
            100% { 
                opacity: 1; 
                transform: scale(1);
            }
        }
        
        .logo-svg {
            height: 220px;
            width: auto;
        }
        
        .tagline {
            margin-top: 64px;
            font-size: 36px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.95);
            letter-spacing: 0.2px;
            opacity: 0;
            animation: taglineReveal 3s cubic-bezier(0.16, 1, 0.3, 1) 7s forwards;
        }
        
        @keyframes taglineReveal {
            0% { 
                opacity: 0; 
            }
            100% { 
                opacity: 1; 
            }
        }
        
        .tagline .highlight {
            color: #a5b4fc;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <svg class="logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 72" fill="none">
                <defs>
                    <linearGradient id="chevronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#6366f1"/>
                        <stop offset="50%" stop-color="#8b5cf6"/>
                        <stop offset="100%" stop-color="#06b6d4"/>
                    </linearGradient>
                </defs>
                <path d="M22 22L33 36L22 50" stroke="url(#chevronGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M35 22L46 36L35 50" stroke="url(#chevronGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.55"/>
                <text x="56" y="36" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" fill="#6366f1" letter-spacing="1" dominant-baseline="central">Stride</text>
            </svg>
        </div>
        
        <p class="tagline">Your Job Search, <span class="highlight">Finally Organized</span></p>
    </div>
</body>
</html>
