<!DOCTYPE html>
<html>
<head>
    <title>Stride - Two Feet Concept</title>
    <style>
        body { 
            font-family: -apple-system, sans-serif; 
            background: #f8fafc; 
            padding: 40px;
            text-align: center;
        }
        h1 { color: #1e293b; margin-bottom: 10px; }
        p { color: #64748b; margin-bottom: 40px; }
        .grid {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .card h3 { margin: 20px 0 10px; color: #1e293b; }
        .card p { font-size: 14px; margin: 0; }
        img { width: 150px; height: 180px; }
        .with-text {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }
        .with-text img { width: 50px; height: 60px; }
        .with-text span { 
            font-size: 28px; 
            font-weight: 700; 
            color: #0284c7;
        }
    </style>
</head>
<body>
    <h1>Two Feet → One Stride</h1>
    <p>Abstract footsteps that form an S together</p>
    
    <div class="grid">
        <div class="card">
            <img src="stride-feet-concept.svg" alt="Concept 1">
            <h3>Interlocking Steps</h3>
            <p>Two curved shapes that interlock</p>
            <div class="with-text">
                <img src="stride-feet-concept.svg">
                <span>Stride</span>
            </div>
        </div>
        
        <div class="card">
            <img src="stride-feet-v2.svg" alt="Concept 2">
            <h3>Simple Ovals</h3>
            <p>Minimal abstract footprints</p>
            <div class="with-text">
                <img src="stride-feet-v2.svg">
                <span>Stride</span>
            </div>
        </div>
        
        <div class="card">
            <img src="stride-feet-v3.svg" alt="Concept 3">
            <h3>Flowing Steps</h3>
            <p>Organic curves, more S-like</p>
            <div class="with-text">
                <img src="stride-feet-v3.svg">
                <span>Stride</span>
            </div>
        </div>
    </div>
</body>
</html>
