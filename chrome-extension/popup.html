<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 320px;
      padding: 16px;
      background: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #1e293b;
    }
    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: #64748b;
      font-size: 18px;
    }
    .settings-btn:hover {
      color: #6366f1;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #64748b;
      margin-bottom: 4px;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 13px;
      color: #1e293b;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
    textarea {
      resize: vertical;
      min-height: 60px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 6px rgba(99, 102, 241, 0.3);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .btn-secondary {
      background: #e2e8f0;
      color: #475569;
    }
    .btn-secondary:hover {
      background: #cbd5e1;
    }
    .message {
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }
    .message.success {
      background: #d1fae5;
      color: #065f46;
      display: block;
    }
    .message.error {
      background: #fee2e2;
      color: #991b1b;
      display: block;
    }
    .message.warning {
      background: #fef3c7;
      color: #92400e;
      display: block;
    }
    .not-linkedin {
      text-align: center;
      padding: 20px;
      color: #64748b;
    }
    .not-linkedin p {
      margin-bottom: 8px;
    }
    .settings-link {
      font-size: 11px;
      color: #6366f1;
      text-decoration: none;
      display: block;
      margin-top: 12px;
      text-align: center;
    }
    #settingsPanel {
      display: none;
    }
    .settings-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #1e293b;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .btn-row .btn {
      flex: 1;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      margin-bottom: 12px;
      padding: 8px;
      border-radius: 6px;
      background: #f1f5f9;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .status-dot.connected {
      background: #22c55e;
    }
    .status-dot.disconnected {
      background: #ef4444;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <svg width="20" height="20" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" style="color: #6366f1;">
        <path d="M14 12L26 24L14 36" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M26 12L38 24L26 36" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
      </svg>
      <h1>Add to Stride</h1>
    </div>
    <button class="settings-btn" id="settingsToggle" title="Settings">⚙️</button>
  </div>

  <!-- Main Content -->
  <div id="content">
    <div id="connectionStatus" class="status-indicator">
      <span class="status-dot disconnected" id="statusDot"></span>
      <span id="statusText">Not configured</span>
    </div>

    <div id="message" class="message"></div>

    <form id="contactForm">
      <div class="form-group">
        <label>Name *</label>
        <input type="text" id="name" required>
      </div>

      <div class="form-group">
        <label>Title</label>
        <input type="text" id="title">
      </div>

      <div class="form-group">
        <label>Company</label>
        <input type="text" id="company">
      </div>

      <div class="form-group">
        <label>Contact Type</label>
        <select id="contact_type">
          <option value="networking">Networking</option>
          <option value="recruiter">Recruiter</option>
          <option value="hiring_manager">Hiring Manager</option>
          <option value="referral">Referral</option>
          <option value="peer">Peer</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Notes</label>
        <textarea id="notes" placeholder="How did you connect? Any context..."></textarea>
      </div>

      <input type="hidden" id="linkedin_url">

      <button type="submit" class="btn btn-primary" id="submitBtn">
        Add Contact
      </button>
    </form>
  </div>

  <!-- Not on LinkedIn -->
  <div id="notLinkedIn" class="not-linkedin" style="display: none;">
    <p>📍 Navigate to a LinkedIn profile</p>
    <p style="font-size: 12px;">This extension works on linkedin.com/in/* pages</p>
  </div>

  <!-- Settings Panel -->
  <div id="settingsPanel">
    <div class="settings-title">Extension Settings</div>

    <div id="settingsMessage" class="message"></div>

    <div class="form-group">
      <label>Server URL *</label>
      <input type="url" id="serverUrl" placeholder="https://your-app.vercel.app">
    </div>

    <div class="form-group">
      <label>API Key *</label>
      <input type="password" id="apiKey" placeholder="Your API key from Settings page">
    </div>

    <div class="btn-row">
      <button type="button" class="btn btn-secondary" id="cancelSettings">Cancel</button>
      <button type="button" class="btn btn-primary" id="saveSettings">Save Settings</button>
    </div>
  </div>

  <a id="viewContactsLink" href="#" target="_blank" class="settings-link">
    View all contacts →
  </a>

  <script src="popup.js"></script>
</body>
</html>
