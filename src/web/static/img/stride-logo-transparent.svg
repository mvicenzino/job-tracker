  <path d="M35 22L46 36L35 50" stroke="url(#chevronGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.55"/>

  <!-- "Stride" wordmark in brand indigo - vertically centered -->
  <text x="56" y="36" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" fill="#6366f1" letter-spacing="1" dominant-baseline="central">Stride</text>
