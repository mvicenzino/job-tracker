{% extends "base.html" %}

{% block title %}Add Contact - Stride{% endblock %}

{% block content %}
<div class="form-page">
    <header class="page-header">
        <h1>Add Contact</h1>
    </header>

    <div class="linkedin-tip">
        <span class="linkedin-tip-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="#0a66c2"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
        </span>
        <div>
            <strong>Import from LinkedIn</strong> &mdash; Use the <a href="{{ url_for('settings.setup') }}">Stride Chrome Extension</a> to save contacts directly from LinkedIn profiles with one click.
        </div>
    </div>

    <form method="post" class="form card">
        <div class="form-group">
            <label for="name">Name *</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="company">Company</label>
                <input type="text" id="company" name="company" list="company-list">
                <datalist id="company-list">
                    {% for company in companies %}
                    <option value="{{ company.name }}">
                    {% endfor %}
                </datalist>
            </div>
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" placeholder="e.g., Engineering Manager">
            </div>
        </div>

        <div class="form-group">
            <label for="contact_type">Contact Type</label>
            <select id="contact_type" name="contact_type">
                {% for ct in ContactType %}
                <option value="{{ ct.value }}">{{ ct.value|replace('_', ' ')|title }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="linkedin_url">LinkedIn URL</label>
            <input type="url" id="linkedin_url" name="linkedin_url" placeholder="https://linkedin.com/in/...">
        </div>

        <div class="form-group">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="3" placeholder="How did you meet? Anything to remember?"></textarea>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('contacts.contacts') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Add Contact</button>
        </div>
    </form>
</div>
{% endblock %}
