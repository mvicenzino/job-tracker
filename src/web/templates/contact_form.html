{% extends "base.html" %}

{% block title %}Add Contact - Stride{% endblock %}

{% block content %}
<div class="form-page">
    <header class="page-header">
        <h1>Add Contact</h1>
    </header>

    <form method="post" class="form card">
        <div class="form-group">
            <label for="name">Name *</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="company">Company</label>
                <input type="text" id="company" name="company" list="company-list">
                <datalist id="company-list">
                    {% for company in companies %}
                    <option value="{{ company.name }}">
                    {% endfor %}
                </datalist>
            </div>
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" placeholder="e.g., Engineering Manager">
            </div>
        </div>

        <div class="form-group">
            <label for="contact_type">Contact Type</label>
            <select id="contact_type" name="contact_type">
                {% for ct in ContactType %}
                <option value="{{ ct.value }}">{{ ct.value|replace('_', ' ')|title }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="linkedin_url">LinkedIn URL</label>
            <input type="url" id="linkedin_url" name="linkedin_url" placeholder="https://linkedin.com/in/...">
        </div>

        <div class="form-group">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="3" placeholder="How did you meet? Anything to remember?"></textarea>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('contacts.contacts') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Add Contact</button>
        </div>
    </form>
</div>
{% endblock %}
