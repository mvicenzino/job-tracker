{% extends "base.html" %}

{% block title %}Add Opportunity - Stride{% endblock %}

{% block content %}
<div class="form-page">
    <header class="page-header">
        <div>
            <a href="{{ url_for('jobs.jobs') }}" class="back-link">← Back to Opportunities</a>
            <h1>Add Opportunity</h1>
        </div>
    </header>

    <div class="card">
        <form method="POST" class="form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="form-group">
                <label for="title">Title *</label>
                <input type="text" id="title" name="title" required placeholder="e.g., Senior Software Engineer">
            </div>

            <div class="form-group">
                <label for="company_id">Company</label>
                <select id="company_id" name="company_id">
                    <option value="">-- Select existing or enter new below --</option>
                    {% for company in companies %}
                    <option value="{{ company.id }}">{{ company.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="company_name">Or Enter New Company</label>
                <input type="text" id="company_name" name="company_name" placeholder="Company name">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" name="location" placeholder="e.g., San Francisco, CA">
                </div>
                <div class="form-group">
                    <label for="remote_type">Work Type</label>
                    <select id="remote_type" name="remote_type">
                        <option value="">Select...</option>
                        <option value="remote">Remote</option>
                        <option value="hybrid">Hybrid</option>
                        <option value="onsite">On-site</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="salary_min">Salary Min</label>
                    <input type="number" id="salary_min" name="salary_min" placeholder="e.g., 120000">
                </div>
                <div class="form-group">
                    <label for="salary_max">Salary Max</label>
                    <input type="number" id="salary_max" name="salary_max" placeholder="e.g., 160000">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="job_url">Posting URL</label>
                    <input type="url" id="job_url" name="job_url" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label for="source">Source</label>
                    <input type="text" id="source" name="source" placeholder="e.g., LinkedIn, Indeed, Referral">
                </div>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="4" placeholder="Paste or summarize the job description..."></textarea>
            </div>

            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="is_flagged" value="1">
                    <span>Save this job (bookmark for later)</span>
                </label>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('jobs.jobs') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Add Opportunity</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
