<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="chevronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap');
      .tagline { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 400; fill: #64748b; }
    </style>
  </defs>
  
  <!-- Background - pure white -->
  <rect width="300" height="300" fill="#ffffff"/>
  
  <!-- Original logo centered - exact dimensions from your SVG (260x72) scaled to fit -->
  <g transform="translate(20, 100)">
    <!-- Double chevron icon - matched to cap-height of text -->
    <path d="M22 22L33 36L22 50" stroke="url(#chevronGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M35 22L46 36L35 50" stroke="url(#chevronGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-opacity="0.55"/>
    
    <!-- "Stride" wordmark in brand indigo - vertically centered -->
    <text x="56" y="36" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" fill="#6366f1" letter-spacing="1" dominant-baseline="central">Stride</text>
  </g>
  
  <!-- Tagline below -->
  <text x="150" y="185" text-anchor="middle" class="tagline">Navigating your next chapter</text>
</svg>
