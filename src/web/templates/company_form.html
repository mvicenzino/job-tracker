{% extends "base.html" %}

{% block title %}Add Company - Stride{% endblock %}

{% block content %}
<div class="form-page">
    <header class="page-header">
        <h1>Add Company</h1>
    </header>

    <form method="post" class="form card">
        <div class="form-group">
            <label for="name">Company Name *</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="industry">Industry</label>
                <input type="text" id="industry" name="industry" placeholder="e.g., Technology, Finance">
            </div>
            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" name="location" placeholder="e.g., San Francisco, CA">
            </div>
        </div>

        <div class="form-group">
            <label for="website">Website</label>
            <input type="url" id="website" name="website" placeholder="https://...">
        </div>

        <div class="form-group">
            <label for="description">Description/Notes</label>
            <textarea id="description" name="description" rows="3" placeholder="What do they do? Why are you interested?"></textarea>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('companies.companies') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Add Company</button>
        </div>
    </form>
</div>
{% endblock %}
