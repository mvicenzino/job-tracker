<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 320px;
      padding: 16px;
      background: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #1e293b;
    }
    .page-type-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .badge-contact {
      background: #dbeafe;
      color: #1e40af;
    }
    .badge-company {
      background: #dcfce7;
      color: #166534;
    }
    .badge-job {
      background: #fef3c7;
      color: #92400e;
    }
    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: #64748b;
      font-size: 18px;
    }
    .settings-btn:hover {
      color: #6366f1;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #64748b;
      margin-bottom: 4px;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 13px;
      color: #1e293b;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
    textarea {
      resize: vertical;
      min-height: 60px;
    }
    .form-row {
      display: flex;
      gap: 8px;
    }
    .form-row .form-group {
      flex: 1;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #1e293b;
      cursor: pointer;
    }
    .checkbox-label input[type="checkbox"] {
      width: auto;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 6px rgba(99, 102, 241, 0.3);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .btn-secondary {
      background: #e2e8f0;
      color: #475569;
    }
    .btn-secondary:hover {
      background: #cbd5e1;
    }
    .message {
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }
    .message.success {
      background: #d1fae5;
      color: #065f46;
      display: block;
    }
    .message.error {
      background: #fee2e2;
      color: #991b1b;
      display: block;
    }
    .message.warning {
      background: #fef3c7;
      color: #92400e;
      display: block;
    }
    .not-linkedin {
      text-align: center;
      padding: 20px;
      color: #64748b;
    }
    .not-linkedin p {
      margin-bottom: 8px;
    }
    .settings-link {
      font-size: 11px;
      color: #6366f1;
      text-decoration: none;
      display: block;
      margin-top: 12px;
      text-align: center;
    }
    #settingsPanel {
      display: none;
    }
    .settings-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #1e293b;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .btn-row .btn {
      flex: 1;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      margin-bottom: 12px;
      padding: 8px;
      border-radius: 6px;
      background: #f1f5f9;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .status-dot.connected {
      background: #22c55e;
    }
    .status-dot.disconnected {
      background: #ef4444;
    }
    .data-form {
      display: none;
    }
    .data-form.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <svg width="20" height="20" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" style="color: #6366f1;">
        <path d="M14 15L23 24L14 33" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M25 15L34 24L25 33" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
      </svg>
      <h1>Add to Stride</h1>
      <span id="pageTypeBadge" class="page-type-badge"></span>
    </div>
    <button class="settings-btn" id="settingsToggle" title="Settings">&#9881;</button>
  </div>

  <!-- Main Content -->
  <div id="content">
    <div id="connectionStatus" class="status-indicator">
      <span class="status-dot disconnected" id="statusDot"></span>
      <span id="statusText">Not configured</span>
    </div>

    <div id="message" class="message"></div>

    <!-- Contact Form -->
    <form id="contactForm" class="data-form">
      <div class="form-group">
        <label>Name *</label>
        <input type="text" id="contact_name" required>
      </div>

      <div class="form-group">
        <label>Title</label>
        <input type="text" id="contact_title">
      </div>

      <div class="form-group">
        <label>Company</label>
        <input type="text" id="contact_company">
      </div>

      <div class="form-group">
        <label>Contact Type</label>
        <select id="contact_type">
          <option value="networking">Networking</option>
          <option value="recruiter">Recruiter</option>
          <option value="hiring_manager">Hiring Manager</option>
          <option value="referral">Referral</option>
          <option value="peer">Peer</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Notes</label>
        <textarea id="contact_notes" placeholder="How did you connect? Any context..."></textarea>
      </div>

      <input type="hidden" id="contact_linkedin_url">

      <button type="submit" class="btn btn-primary" id="contactSubmitBtn">
        Add Contact
      </button>
    </form>

    <!-- Company Form -->
    <form id="companyForm" class="data-form">
      <div class="form-group">
        <label>Company Name *</label>
        <input type="text" id="company_name" required>
      </div>

      <div class="form-group">
        <label>Industry</label>
        <input type="text" id="company_industry">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Size</label>
          <input type="text" id="company_size" placeholder="e.g., 1000-5000">
        </div>
        <div class="form-group">
          <label>Location</label>
          <input type="text" id="company_location">
        </div>
      </div>

      <div class="form-group">
        <label>Website</label>
        <input type="url" id="company_website" placeholder="https://...">
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="company_description" placeholder="About the company..."></textarea>
      </div>

      <input type="hidden" id="company_linkedin_url">

      <button type="submit" class="btn btn-primary" id="companySubmitBtn">
        Add Company
      </button>
    </form>

    <!-- Job Form -->
    <form id="jobForm" class="data-form">
      <div class="form-group">
        <label>Job Title *</label>
        <input type="text" id="job_title" required>
      </div>

      <div class="form-group">
        <label>Company *</label>
        <input type="text" id="job_company" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Location</label>
          <input type="text" id="job_location">
        </div>
        <div class="form-group">
          <label>Work Type</label>
          <select id="job_remote_type">
            <option value="">Select...</option>
            <option value="remote">Remote</option>
            <option value="hybrid">Hybrid</option>
            <option value="onsite">On-site</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="job_description" placeholder="Job description..."></textarea>
      </div>

      <div class="form-group">
        <label class="checkbox-label">
          <input type="checkbox" id="job_is_flagged">
          <span>Save this job (bookmark for later)</span>
        </label>
      </div>

      <input type="hidden" id="job_url">

      <button type="submit" class="btn btn-primary" id="jobSubmitBtn">
        Add Job
      </button>
    </form>
  </div>

  <!-- Not on LinkedIn -->
  <div id="notLinkedIn" class="not-linkedin" style="display: none;">
    <p>Navigate to a LinkedIn page</p>
    <p style="font-size: 12px;">Supported: Profiles, Company pages, Job listings</p>
  </div>

  <!-- Settings Panel -->
  <div id="settingsPanel">
    <div class="settings-title">Extension Settings</div>

    <div id="settingsMessage" class="message"></div>

    <div class="form-group">
      <label>Server URL *</label>
      <input type="url" id="serverUrl" placeholder="https://your-app.vercel.app">
    </div>

    <div class="form-group">
      <label>API Key *</label>
      <input type="password" id="apiKey" placeholder="Your API key from Settings page">
    </div>

    <div class="btn-row">
      <button type="button" class="btn btn-secondary" id="cancelSettings">Cancel</button>
      <button type="button" class="btn btn-primary" id="saveSettings">Save Settings</button>
    </div>
  </div>

  <a id="viewLink" href="#" target="_blank" class="settings-link">
    View in Stride &rarr;
  </a>

  <script src="popup.js"></script>
</body>
</html>
